		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #121721;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<!-- Chompimon web page extras (export_presets.cfg html/head_include is set from
     this file by tools/web/apply_head_include.py). On phones: a FULL SCREEN
     button, and a "turn your phone sideways" screen while it's held upright
     IN THE CITY only (sign-in and the Journal hub are played upright: the game
     says which with window.cmMode, see scripts/screen_mode.gd).
     at01.ttf is copied next to index.html when the web version is published. -->
<style>
@font-face { font-family: at01; src: url("at01.ttf"); }
#cm-fs { position: fixed; left: 10px; bottom: 10px; z-index: 10; display: none;
  font: 16px at01, monospace; color: #1f2d3d; background: #f6efe0; border: 2px solid #1f2d3d;
  border-radius: 6px; padding: 6px 10px; opacity: 0.9; }
#cm-rot { position: fixed; inset: 0; z-index: 20; display: none; background: #1f2d3d; color: #f6efe0;
  font: 32px at01, monospace; text-align: center; flex-direction: column; align-items: center;
  justify-content: center; gap: 18px; padding: 24px; }
#cm-rot small { font-size: 16px; opacity: 0.8; }
#cm-rot button { font: 16px at01, monospace; color: #1f2d3d; background: #f6efe0; border: 2px solid #f6efe0;
  border-radius: 6px; padding: 8px 14px; }
@media (pointer: coarse) and (orientation: portrait) { body.cm-wide #cm-rot { display: flex; } }
#cm-help { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 30; display: none;
  font: 16px at01, monospace; color: #1f2d3d; background: #f6efe0; border: 2px solid #1f2d3d; border-radius: 8px;
  padding: 10px 14px; text-align: center; max-width: 90vw; box-shadow: 0 4px 0 rgba(0,0,0,0.35); }
#cm-help small { display: block; font: 12px monospace; color: #6b6b6b; margin-top: 6px; max-width: 80vw;
  overflow-wrap: anywhere; text-align: left; }
#cm-help button { font: 16px at01, monospace; color: #fffaf1; background: #ee6b5b; border: 2px solid #9c3a2e;
  border-radius: 6px; padding: 6px 14px; margin-left: 10px; }
/* The page's own loading screen (while the game downloads): laid out like the
   game's loading screen (scripts/loading_screen.gd), so it reads as one loading
   screen: the splash fills the window (cut at the sides, or at the bottom on a
   very wide one), the game's loading bar just under the credit line and the
   text above it. */
#status { background-color: #000 !important; }
#status-splash.fullsize--true { left: 0; right: 0; width: 100%; height: 100%; max-width: none; margin: 0;
  object-fit: cover; object-position: center top; }
#status-progress { display: none !important; }
body.cm-loading #cm-fs { display: none !important; }   /* (it would sit on the bar: back once the game is up) */
#cm-load { position: absolute; top: 0; bottom: 0; left: 0; right: 0; pointer-events: none; }
#cm-load-text { position: absolute; left: 0; right: 0; text-align: center; font-family: at01, monospace;
  color: #fff3dc; line-height: 1; white-space: nowrap; }
#cm-load-bar { position: absolute; left: 50%; transform: translateX(-50%); background: #75452e;
  outline: 1px solid #372015; overflow: hidden; }
#cm-load-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #fd9d40;
  transition: width 0.25s linear; }
#cm-load-fill::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 50%; background: #ffd955; }
</style>
<script>
// If the game stops or freezes (out of memory on a phone, the graphics reset,
// a crash), say so with a RELOAD button instead of leaving a blank screen.
// The game calls cmBeat() every second (screen_mode.gd). The heartbeat is
// the proof: an error message alone never shows "stopped" - only an error
// AND no heartbeat for a few seconds after it (a real crash) does.
(() => {
  let lastBeat = 0, started = false, shown = "", suspect = 0, lastErr = "";
  const BUILD = "a90bf37a97";
  window.cmBeat = () => { lastBeat = Date.now(); started = true; if (shown === "slow" || shown === "dead") hide(); };
  const box = () => {
    let b = document.getElementById("cm-help");
    if (!b) {
      b = document.createElement("div"); b.id = "cm-help";
      b.innerHTML = "<span></span><button>RELOAD</button><small></small>";
      b.querySelector("button").onclick = () => location.reload();
      document.body.appendChild(b);
    }
    return b;
  };
  // what went wrong, the browser and the build: shown small under the message, for a screenshot
  const details = () => (lastErr ? lastErr.slice(0, 220) + " | " : "") + navigator.userAgent.replace(/^Mozilla\/5\.0 /, "").slice(0, 120) + " | build " + BUILD;
  const show = (kind, text) => { shown = kind; const b = box(); b.querySelector("span").textContent = text;
    b.querySelector("small").textContent = kind === "slow" ? "" : details(); b.style.display = "block"; };
  const hide = () => { shown = ""; suspect = 0; const b = document.getElementById("cm-help"); if (b) b.style.display = "none"; };
  const fatal = /Aborted\(|out of memory|RuntimeError|unreachable executed/;
  const note = (msg) => { const m = String(msg); if (fatal.test(m)) { lastErr = m; if (started) suspect = Date.now(); } };
  addEventListener("error", (e) => note(e.message));
  addEventListener("unhandledrejection", (e) => note(e.reason));
  const err = console.error.bind(console);
  console.error = (...a) => { err(...a); note(a.join(" ")); };
  addEventListener("DOMContentLoaded", () => {
    const cv = document.getElementById("canvas");
    if (cv) cv.addEventListener("webglcontextlost", () => show("gpu", "The graphics stopped on this device."), false);
  });
  setInterval(() => {
    if (!started && lastErr && !shown && !document.getElementById("status")) { show("dead", "Chompimon stopped while starting."); return; }
    if (!started || document.hidden || shown === "gpu") return;
    const quiet = Date.now() - lastBeat;
    if (suspect && quiet > 6000 && lastBeat < suspect + 1500) show("dead", "Chompimon stopped.");
    else if (quiet > 25000 && shown === "") show("slow", "Still working... if it stays stuck, reload.");
  }, 2000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) lastBeat = Date.now(); });
})();
// a password-reset link that landed on the game page: send it to the reset page
if (/(type=recovery|error_code=)/.test(location.hash)) location.replace("reset.html" + location.hash);
addEventListener("DOMContentLoaded", () => {
  const touch = matchMedia("(pointer: coarse)").matches;
  const can = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  const el = document.documentElement;
  const go = () => {
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) return;
    Promise.resolve(req.call(el)).then(lock).catch(() => {});
  };
  // the game's screen: "portrait" (sign-in, the Journal hub) or "landscape" (the city)
  let mode = "portrait";
  // ("free": a tablet or computer outside the city, any way up)
  const lock = () => {
    try { if (mode === "free") screen.orientation.unlock(); else screen.orientation.lock(mode).catch(() => {}); } catch (e) {}
  };
  window.cmMode = (m) => {
    mode = m === "landscape" ? "landscape" : (m === "free" ? "free" : "portrait");
    document.body.classList.toggle("cm-wide", mode === "landscape");
    if (document.fullscreenElement || document.webkitFullscreenElement) lock();
  };
  const b = document.createElement("button");
  b.id = "cm-fs"; b.textContent = "FULL SCREEN"; b.onclick = go;
  document.body.appendChild(b);
  const r = document.createElement("div");
  r.id = "cm-rot";
  r.innerHTML = "<div>TURN YOUR PHONE SIDEWAYS</div><small>The city plays in landscape.</small>" +
    (can ? "<button id='cm-fs2'>FULL SCREEN</button>" : "") + "<button id='cm-hub'>BACK TO JOURNAL</button>";
  document.body.appendChild(r);
  const b2 = document.getElementById("cm-fs2");
  if (b2) b2.onclick = go;
  document.getElementById("cm-hub").onclick = () => { if (window.cmToHub) window.cmToHub(); };
  const update = () => {
    const full = !!(document.fullscreenElement || document.webkitFullscreenElement);
    b.style.display = (touch && can && !full) ? "block" : "none";
  };
  document.addEventListener("fullscreenchange", update);
  document.addEventListener("webkitfullscreenchange", update);
  update();
});
// The loading bar while the game downloads (see the styles above). The web
// export's own page still drives a hidden <progress>; this follows it.
addEventListener("DOMContentLoaded", () => {
  const status = document.getElementById("status"), prog = document.getElementById("status-progress");
  if (!status || !prog) return;
  const box = document.createElement("div");
  box.id = "cm-load";
  box.innerHTML = "<div id='cm-load-text'>Loading...</div><div id='cm-load-bar'><div id='cm-load-fill'></div></div>";
  status.appendChild(box);
  const text = box.firstChild, bar = box.lastChild, fill = bar.firstChild;
  // The game's own measure: its screen is 640 x 360 or more (360 x 640 or more on a
  // phone held upright), scaled to fill the window. The splash (1280 x 714) covers
  // the window from the top; its credit line is at 96.1-98% of its height. The bar
  // (200 x 4 of the game's px) sits at 355/360 of it and the text ends just above
  // the credit line; when that line is cut off (a very wide window) both sit at
  // the bottom instead.
  const fit = () => {
    const w = status.clientWidth || innerWidth, h = status.clientHeight || innerHeight;
    const phone = matchMedia("(pointer: coarse)").matches && Math.min(screen.width, screen.height) < 600;
    const s = (phone && h > w) ? Math.min(w / 360, h / 640) : Math.min(w / 640, h / 360);
    const px = Math.max(1, Math.round(s));
    const imgH = Math.max(h, w * 714 / 1280);
    const bh = Math.max(3, Math.round(4 * s));
    let barTop = Math.round(imgH * 355 / 360);
    const size = 16 * Math.max(2, Math.round(s));          // at01 is drawn for 16 px: whole steps stay sharp
    let textTop = Math.floor(imgH * 0.9608) - size - 3 * px;
    if (barTop + bh + px > h) { barTop = h - bh - px; textTop = barTop - size - 6 * px; }
    bar.style.width = Math.round(200 * s) + "px";
    bar.style.height = bh + "px";
    bar.style.outlineWidth = px + "px";
    bar.style.top = barTop + "px";
    text.style.fontSize = size + "px";
    text.style.top = textTop + "px";
    const o = px + "px", c = " #1f2d3d";
    text.style.textShadow = ["-" + o + " 0", o + " 0", "0 -" + o, "0 " + o, "-" + o + " -" + o, o + " -" + o,
      "-" + o + " " + o, o + " " + o].map((d) => d + " 0" + c).join(", ");
  };
  fit();
  addEventListener("resize", fit);
  document.body.classList.add("cm-loading");
  new MutationObserver(() => { if (!status.isConnected) document.body.classList.remove("cm-loading"); })
    .observe(status.parentNode, { childList: true });
  let seen = false;
  const follow = () => {
    const max = parseFloat(prog.getAttribute("max")), val = parseFloat(prog.getAttribute("value"));
    if (max > 0 && val >= 0) {
      seen = true;
      const part = Math.min(1, val / max);
      fill.style.width = (part * 100) + "%";
      text.textContent = "Loading... " + Math.round(part * 100) + "%";
    } else if (seen) {                       // downloaded: the game is starting up
      fill.style.width = "100%";
      text.textContent = "Starting...";
    }
  };
  new MutationObserver(follow).observe(prog, { attributes: true });
  follow();
});
</script>

	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"mainPack":"index.a90bf37a97.pck","fileSizes":{"index.a90bf37a97.pck":45431064,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
