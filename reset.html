<!doctype html>
<!-- Chompimon: set a new password. The "Forgot password?" e-mail links here
     (Supabase puts a one-time sign-in in the address after #). The player types
     the new password; this page sends it straight to Supabase. Published next
     to index.html by tools/web/publish.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chompimon · New password</title>
<style>
@font-face { font-family: at01; src: url("at01.ttf"); }
:root { --ink: #1f3a4a; --cream: #f6efe0; --card: #fffaf1; --edge: #c9a574; --coral: #d4503f; --teal: #3f8f86; --muted: #6b6f70; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: var(--cream); color: var(--ink); font: 20px at01, monospace; padding: 16px; }
.card { width: 100%; max-width: 380px; background: var(--card); border: 3px solid var(--ink);
  border-radius: 8px; padding: 22px 22px 18px; box-shadow: 0 4px 0 var(--edge); }
h1 { font-size: 32px; margin: 0 0 4px; text-align: center; letter-spacing: 1px; }
p { margin: 8px 0; color: var(--muted); line-height: 1.3; }
label { display: block; margin: 14px 0 4px; font-size: 16px; letter-spacing: 1px; }
input { width: 100%; font: 20px at01, monospace; color: var(--ink); background: #fff; border: 2px solid var(--edge);
  border-radius: 6px; padding: 8px 10px; }
input:focus { outline: none; border-color: var(--coral); }
button { width: 100%; margin-top: 18px; font: 20px at01, monospace; color: #fffaf1; background: var(--teal);
  border: 2px solid var(--ink); border-radius: 6px; padding: 10px; cursor: pointer; }
button:disabled { opacity: 0.6; cursor: default; }
#msg { min-height: 26px; margin-top: 12px; text-align: center; }
.bad { color: var(--coral); } .good { color: var(--teal); }
a { color: var(--coral); }
.hide { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>NEW PASSWORD</h1>
  <form id="form" class="hide" autocomplete="on">
    <p>Choose a new password for <b id="who"></b>.</p>
    <label for="pw">NEW PASSWORD</label>
    <input id="pw" type="password" autocomplete="new-password" minlength="8" required>
    <label for="pw2">TYPE IT AGAIN</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
    <button id="save" type="submit">SAVE PASSWORD</button>
  </form>
  <div id="msg"></div>
  <p id="back" class="hide" style="text-align:center"><a href="./">Back to Chompimon</a></p>
</div>
<script>
const SUPABASE_URL = "https://vodxvtuyoksiucgpzswn.supabase.co";
const KEY = "sb_publishable_UIqxJnANktg2xDzMubz-0Q_HEuYS_pz";
const $ = (id) => document.getElementById(id);
const say = (t, cls) => { $("msg").textContent = t; $("msg").className = cls || ""; };
// the sign-in Supabase put after # (then wipe it from the address bar)
const h = new URLSearchParams(location.hash.slice(1));
history.replaceState(null, "", location.pathname);
const token = h.get("access_token");
if (h.get("error") || h.get("error_code")) {
  say(h.get("error_code") === "otp_expired"
    ? "This link has expired or was already used. In the game, press \"Forgot password?\" again and use the newest e-mail."
    : "This link didn't work: " + (h.get("error_description") || h.get("error")), "bad");
  $("back").classList.remove("hide");
} else if (!token || (h.get("type") && h.get("type") !== "recovery")) {
  say("Open this page from the \"reset your password\" e-mail.", "bad");
  $("back").classList.remove("hide");
} else {
  $("form").classList.remove("hide");
  try {
    const p = JSON.parse(atob(token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
    $("who").textContent = p.email || "your account";
  } catch (e) { $("who").textContent = "your account"; }
  $("form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const pw = $("pw").value, pw2 = $("pw2").value;
    if (pw.length < 8) return say("Use at least 8 characters.", "bad");
    if (pw !== pw2) return say("The two passwords don't match.", "bad");
    $("save").disabled = true;
    say("Saving...");
    try {
      const r = await fetch(SUPABASE_URL + "/auth/v1/user", {
        method: "PUT",
        headers: { "apikey": KEY, "Authorization": "Bearer " + token, "Content-Type": "application/json" },
        body: JSON.stringify({ password: pw }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        const m = d.msg || d.message || d.error_description || "";
        $("save").disabled = false;
        if (r.status === 401 || /expired|invalid/i.test(m)) {
          say("This link has expired. In the game, press \"Forgot password?\" again.", "bad");
        } else if (/same/i.test(m)) {
          say("That's your old password. Pick a new one.", "bad");
        } else {
          say(m || "Couldn't save it. Please try again.", "bad");
        }
        return;
      }
      $("form").classList.add("hide");
      say("Password saved! Sign in to the game with your new password.", "good");
      $("back").classList.remove("hide");
    } catch (e) {
      $("save").disabled = false;
      say("No connection. Check your internet and try again.", "bad");
    }
  });
}
</script>
</body>
</html>
