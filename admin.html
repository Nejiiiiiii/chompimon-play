:root{--navy:#33415e;--navy-2:#4a5a7a;--navy-ink:#1e283d;--coral:#ee6b5b;--coral-ink:#c94e3f;--coral-soft:#fde3dc;--cream:#f7efe2;--paper:#fffaf1;--card:#fff6ea;--edge:#e7c9b6;--line:#efdccb;--ink:#2a2a35;--muted:#8a7766;--green:#3f9a52;--green-soft:#e1f2e2;--red:#c4453a;--gold:#c98a12;--gold-soft:#fbefc9;--blue:#3f6fc4;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html{background:var(--cream)}
body{background:radial-gradient(circle at 1px 1px,rgba(201,138,18,.10) 1px,transparent 1.5px) 0 0/18px 18px,var(--cream);min-height:100vh}
.px{font-family:"Pixelify Sans",system-ui,sans-serif;font-weight:400;letter-spacing:.3px}
header{background:var(--navy);color:var(--paper);display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap;border-bottom:4px solid var(--navy-ink)}
header h1{font:400 24px/1 "Pixelify Sans",system-ui,sans-serif;margin:0;letter-spacing:.5px}
header h1 span{color:#ffd774}
#who{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#who .email{opacity:.85;font-size:14px}
main{max-width:1080px;margin:0 auto;padding:22px 16px 72px}

/* panels: cream with a peach rim and a firm bottom edge, like the game's menus */
.card{background:var(--card);border:2px solid var(--edge);border-radius:16px;padding:20px;margin:0 0 18px;box-shadow:inset 0 0 0 3px var(--paper),0 3px 0 #e2c3ad}
.card.narrow{max-width:420px;margin:56px auto}
.card.highlight{border-color:#e9b949;box-shadow:inset 0 0 0 3px var(--paper),0 3px 0 #dba73a,0 0 0 4px rgba(233,185,73,.18)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 6px}
.card-head h2{margin:0}
/* section titles are navy tags */
h2{display:inline-block;font:400 17px/1 "Pixelify Sans",system-ui,sans-serif;letter-spacing:.4px;margin:0 0 12px;padding:6px 12px 7px;background:var(--navy);color:var(--paper);border-radius:9px;box-shadow:0 2px 0 var(--navy-ink)}
h3{font:400 16px/1.2 "Pixelify Sans",system-ui,sans-serif;color:var(--navy);margin:20px 0 10px}
.muted{color:var(--muted);margin:0 0 14px}
.hint{color:var(--muted);font-size:12.5px}
.error{color:var(--red);font-weight:600}
.warn{background:var(--gold-soft);border:2px solid #efd28a;border-radius:10px;padding:8px 12px;color:#7a5410;font-weight:600}
.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.row>.btn{margin-top:24px}
.row .field{flex:1 1 160px}
.field{display:flex;flex-direction:column;gap:5px;margin:0 0 12px}
.field-label{font-size:13px;font-weight:700;color:var(--navy)}
input,select{font:inherit;padding:10px 12px;border:2px solid var(--edge);border-radius:10px;background:var(--paper);color:var(--ink);min-width:0}
input:focus,select:focus{outline:3px solid rgba(238,107,91,.22);border-color:var(--coral)}
.otp{font-size:24px;letter-spacing:6px;text-align:center}

/* buttons are pills with a darker bottom edge; they press down when tapped */
.btn{font:inherit;font-weight:700;border:2px solid var(--edge);background:var(--paper);color:var(--navy);border-radius:99px;padding:9px 18px;cursor:pointer;margin:0 0 12px;box-shadow:0 3px 0 #e2c3ad;transition:transform .05s,box-shadow .05s}
.btn:hover{background:#fff}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #e2c3ad}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.btn.primary{background:var(--coral);border-color:var(--coral-ink);color:#fff;box-shadow:0 3px 0 #a83c30}
.btn.primary:hover{background:#f27a6b}
.btn.primary:active{box-shadow:0 1px 0 #a83c30}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:inherit}
header .btn.ghost{color:var(--paper);margin:0;border-color:rgba(255,250,241,.35);padding:6px 14px}
header .btn.ghost:hover{background:rgba(255,255,255,.08)}
.btn.small{padding:4px 12px;font-size:13px;margin:0;box-shadow:0 2px 0 #e2c3ad}
.btn.danger{color:var(--red);border-color:#efbcb3}
.card.narrow .btn{width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* tabs: a row of pills, the open one coral */
.tabs{display:flex;gap:8px;margin:0 0 18px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.tab{font:400 16px/1 "Pixelify Sans",system-ui,sans-serif;letter-spacing:.3px;background:var(--paper);border:2px solid var(--edge);border-radius:99px;padding:9px 18px 10px;color:var(--navy);cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 #e2c3ad}
.tab:hover{background:#fff}
.tab.on{background:var(--coral);border-color:var(--coral-ink);color:#fff;box-shadow:0 3px 0 #a83c30}

.badge{display:inline-block;font:400 13px/1 "Pixelify Sans",system-ui,sans-serif;letter-spacing:.5px;text-transform:uppercase;padding:4px 10px 5px;border-radius:99px;background:#e3e9f6;color:var(--navy)}
.badge.admin{background:#ffd774;color:#4a3305}

}

<script>// ---- Tiny QR encoder (byte mode, error correction M, versions 1-10) ----
const QR = (() => {
  const ECC = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];
  const BLOCKS = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
  const rawModules = v => {
    let r = (16 * v + 128) * v + 64;
    if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; }
    return r;
  };
  const dataCodewords = v => Math.floor(rawModules(v) / 8) - ECC[v] * BLOCKS[v];
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11d); z ^= ((y >>> i) & 1) * x; } return z & 0xff; };
  const divisor = d => {
    const r = new Array(d).fill(0); r[d - 1] = 1; let root = 1;
    for (let i = 0; i < d; i++) {
      for (let j = 0; j < d; j++) { r[j] = mul(r[j], root); if (j + 1 < d) r[j] ^= r[j + 1]; }
      root = mul(root, 2);
    }
    return r;
  };
  const remainder = (data, div) => {
    const r = div.map(() => 0);
    for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= mul(c, f); }); }
    return r;
  };
  function encode(text) {
    const bytes = Array.from(new TextEncoder().encode(text));
    let v = 1;
    while (v <= 10 && 4 + 8 + bytes.length * 8 > dataCodewords(v) * 8) v++;
    if (v > 10) throw new Error('text too long for QR');
    const bits = [];
    const put = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, 8); bytes.forEach(b => put(b, 8));
    const cap = dataCodewords(v) * 8;
    put(0, Math.min(4, cap - bits.length));
    put(0, (8 - bits.length % 8) % 8);
    for (let p = 0xec; bits.length < cap; p ^= 0xec ^ 0x11) put(p, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) data.push(parseInt(bits.slice(i, i + 8).join(''), 2));

    const nb = BLOCKS[v], ec = ECC[v], raw = Math.floor(rawModules(v) / 8);
    const nShort = nb - raw % nb, shortLen = Math.floor(raw / nb), div = divisor(ec);
    const blocks = []; let k = 0;
    for (let i = 0; i < nb; i++) {
      const d = data.slice(k, k + shortLen - ec + (i < nShort ? 0 : 1)); k += d.length;
      const e = remainder(d, div); if (i < nShort) d.push(0); blocks.push(d.concat(e));
    }
    const cw = [];
    for (let i = 0; i < blocks[0].length; i++)
      for (let j = 0; j < nb; j++) if (i !== shortLen - ec || j >= nShort) cw.push(blocks[j][i]);
    // modules
    const size = v * 4 + 17;
    const m = [...Array(size)].map(() => Array(size).fill(false));
    const fn = [...Array(size)].map(() => Array(size).fill(false));
    const set = (x, y, dark) => { m[y][x] = dark; fn[y][x] = true; };
    for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    for (const [cx, cy] of [[3, 3], [size - 4, 3], [3, size - 4]])
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
        if (x >= 0 && x < size && y >= 0 && y < size) set(x, y, d !== 2 && d !== 4);
      }
    if (v > 1) {
      const n = Math.floor(v / 7) + 2, step = Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2, pos = [6];
      for (let p = size - 7; pos.length < n; p -= step) pos.splice(1, 0, p);
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
        if ((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)) continue;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
          set(pos[i] + dx, pos[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      }
    }
    const format = mask => {
      const d = (0 << 3) | mask;            // level M = 0b00
      let r = d; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = ((d << 10) | r) ^ 0x5412, bit = i => ((b >>> i) & 1) === 1;
      for (let i = 0; i <= 5; i++) set(8, i, bit(i));
      set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(i));
      set(8, size - 8, true);
    };
    format(0);
    if (v >= 7) {
      let r = v; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1f25);
      const b = (v << 12) | r;
      for (let i = 0; i < 18; i++) { const bit = ((b >>> i) & 1) === 1, a = size - 11 + i % 3, c = Math.floor(i / 3); set(a, c, bit); set(c, a, bit); }
    }
    let i = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!fn[y][x] && i < cw.length * 8) { m[y][x] = ((cw[i >>> 3] >>> (7 - (i & 7))) & 1) === 1; i++; }
      }
    }
    const masks = [
      (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x, y) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => (x * y) % 2 + (x * y) % 3 === 0,
      (x, y) => ((x * y) % 2 + (x * y) % 3) % 2 === 0, (x, y) => ((x + y) % 2 + (x * y) % 3) % 2 === 0,
    ];
    const applyMask = k => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && masks[k](x, y)) m[y][x] = !m[y][x]; };
    const penalty = () => {   // runs, 2x2 blocks and dark balance (enough to pick a readable mask)
      let p = 0, dark = 0;
      for (let a = 0; a < size; a++) {
        let rx = 1, ry = 1;
        for (let b = 1; b < size; b++) {
          if (m[a][b] === m[a][b - 1]) { rx++; if (rx === 5) p += 3; else if (rx > 5) p++; } else rx = 1;
          if (m[b][a] === m[b - 1][a]) { ry++; if (ry === 5) p += 3; else if (ry > 5) p++; } else ry = 1;
        }
      }
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        if (m[y][x]) dark++;
        if (x < size - 1 && y < size - 1 && m[y][x] === m[y][x + 1] && m[y][x] === m[y + 1][x] && m[y][x] === m[y + 1][x + 1]) p += 3;
      }
      return p + Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10;
    };
    let best = 0, bestP = Infinity;
    for (let k = 0; k < 8; k++) { if (k === 1) continue;   // striped mask trips some scanners
      applyMask(k); format(k); const p = penalty(); if (p < bestP) { bestP = p; best = k; } applyMask(k); }
    applyMask(best); format(best);
    return m;
  }
  // SVG with a 4-module quiet zone.
  function svg(text, px = 4) {
    const m = encode(text), n = m.length + 8;
    let d = '';
    m.forEach((row, y) => row.forEach((on, x) => { if (on) d += `M${x + 4} ${y + 4}h1v1h-1z`; }));
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" width="${n * px}" height="${n * px}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  return { encode, svg };
})();

const AWS_COGNITO_URL = 'https://cognito-idp.ap-southeast-2.amazonaws.com/';

// ---------- tiny DOM helper (text only: never innerHTML with data) ----------
const $ = sel => document.querySelector(sel);
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;

const fmtDate = s => s ? new Date(s).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '';
const fmtNum = n => Number(n).toLocaleString();

// ---------- API ----------
class ApiError extends Error {}
async function call(path, { method = 'GET', body, auth = true } = {}) {

// Cognito's sign-in API (JSON over HTTPS). Errors become plain sentences.
async function cognito(action, body) {
  let res;

    res = await fetch(AWS_COGNITO_URL, { method: 'POST', body: JSON.stringify(body),

// a simple bar chart (inline SVG): one group of bars per day
function barChart(days, series) {
  const NS = 'http://www.w3.org/2000/svg', W = 640, H = 170, padL = 26, padB = 22, top = 10;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('class', 'chart'); svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Last 14 days: ' + series.map(s => s.label).join(', '));
  const el = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; svg.append(e); return e; };
  const max = Math.max(1, ...days.flatMap(d => series.map(s => +d[s.key] || 0)));
  const step = Math.ceil(max / 4);
  const top_ = step * 4;
  for (let i = 0; i <= 4; i++) {
    const y = top + (H - padB - top) * (1 - i / 4);
    el('line', { x1: padL, x2: W, y1: y, y2: y, class: 'grid' });
    el('text', { x: padL - 6, y: y + 4, class: 'axis', 'text-anchor': 'end' }, String(step * i));
  }
  const gw = (W - padL) / days.length, bw = Math.max(3, (gw - 8) / series.length);
  days.forEach((d, i) => {
    series.forEach((s, k) => {
      const v = +d[s.key] || 0, bh = (H - padB - top) * v / top_;
      const r = el('rect', { x: padL + i * gw + 4 + k * bw, y: H - padB - bh, width: bw - 1, height: Math.max(bh, v ? 1 : 0), rx: 2, class: 'bar ' + s.cls });
      const t = document.createElementNS(NS, 'title'); t.textContent = d.day + ' · ' + s.label + ': ' + v; r.append(t);
    });
    if (i % 2 === 0 || days.length <= 7) el('text', { x: padL + i * gw + gw / 2, y: H - 6, class: 'axis', 'text-anchor': 'middle' },
      new Date(d.day + 'T00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' }));
  });
  const legend = h('div', { class: 'legend' }, series.map(s => h('span', {}, h('i', { class: 'sw ' + s.cls }), s.label)));
  return h('div', {}, svg, legend);
}

// ---------- events (admin makes them; everyone can see them) ----------
const EVENT_KINDS = { double_coins: 'Double coins', exp_boost: 'EXP boost', simon_week: 'Simon week', bonus_badges: 'Bonus badges', message: 'Message only' };
const EVENT_HELP = {
  double_coins: 'Coins from battles, quests, the daily bonus and minigames are multiplied. Codes, gifts and goals are not.',
  exp_boost: 'Simons\' EXP from wild and trainer battles is multiplied. Player EXP and feeding are not.',

  bonus_badges: '16 oz and 22 oz drink codes give extra badges: for one drink, or for every drink.',
  message: 'Just a banner in the game: for a store promo, an opening, a holiday.' };
function eventWhat(e) {
  const p = e.params || {};
  if (e.kind === 'double_coins') return 'Coins ×' + (+p.mult || 2);
  if (e.kind === 'exp_boost') return 'Simon EXP ×' + (+p.mult || 2);
  if (e.kind === 'simon_week') return 'More ' + simonName(p.species) + ' (' + Math.round((+p.chance || 0.4) * 100) + '% of finds)';
  if (e.kind === 'bonus_badges') return '+' + (p.extra || 1) + ' badge' + ((p.extra || 1) === 1 ? '' : 's') + ' · ' + (p.species ? simonName(p.species) + ' drinks' : 'every drink');
  return 'Banner only';
}
const toLocal = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 16); };

      await species();
      const rows = await rpc('admin_list_events');
      list.replaceChildren(rows.length ? table(['Event', 'What it does', 'When', 'Status', 'Made by', ''], rows.map(e => {
        const acts = h('div', { class: 'actions' });
        if (isAdmin() && e.status !== 'ended') {
          acts.append(h('button', { class: 'btn small', type: 'button', onclick: () => {
            editing = e.id; kind.value = e.kind; title.value = e.title; msg.value = e.body || '';
            const p = e.params || {};
            if (p.mult) { mult.value = String(p.mult); xmult.value = String(p.mult); }
            if (p.species && e.kind === 'simon_week') simon.value = p.species;
            if (p.chance) chance.value = String(p.chance);
            if (e.kind === 'bonus_badges') { extra.value = p.extra || 1; bSimon.value = p.species || ''; }
            starts.value = toLocal(new Date(e.starts_at)); ends.value = toLocal(new Date(e.ends_at));
            btn.textContent = 'Save changes'; cancel.classList.remove('hidden'); sync();
            form.scrollIntoView({ behavior: 'smooth' });
          } }, 'Edit'), h('button', { class: 'btn small danger', type: 'button', onclick: ev => {
            if (!confirm('End "' + e.title + '" now? Players stop getting its bonus right away.')) return;
            guarded(ev.target, async () => { await rpc('admin_end_event', { p_id: e.id }); toast('Event ended.'); load(); });
          } }, 'End now'));
        }
        return [h('span', {}, h('b', {}, e.title), e.body ? h('br') : null, e.body ? h('small', { class: 'muted' }, e.body) : null),
          h('span', {}, h('span', { class: 'rar ' + (e.kind === 'double_coins' ? 'legendary' : e.kind === 'simon_week' ? 'epic' : e.kind === 'bonus_badges' ? 'rare' : 'common') }, EVENT_KINDS[e.kind] || e.kind), h('br'), eventWhat(e)),
          h('span', {}, fmtDate(e.starts_at), h('br'), h('small', { class: 'muted' }, 'to ' + fmtDate(e.ended_at && new Date(e.ended_at) < new Date(e.ends_at) ? e.ended_at : e.ends_at))),
          pill({ live: 'active', scheduled: 'expired', ended: 'used' }[e.status], { live: 'Live', scheduled: 'Scheduled', ended: 'Ended' }[e.status]),
          e.created_by_email || '', acts];
      })) : empty('No events yet. Make one above.'));
    } catch (e) { list.replaceChildren(h('p', { class: 'error' }, e.message)); }
  };
  body.append(form, h('div', { class: 'card' }, cardHead('All events', h('button', { class: 'btn small', type: 'button', onclick: () => load() }, 'Refresh')),
    h('p', { class: 'muted' }, 'Live events show as a banner in the game and on its Events page. Only one of each kind counts at a time (the newest).'), list));
  sync();
  load();
}

// ---------- staff (admin) ----------
function staffView(body) {
  const list = h('div');
  const email = h('input', { type: 'email', required: true, placeholder: 'their account e-mail' });
  const role = h('select', {}, h('option', { value: 'staff' }, 'Staff: make codes, accept vouchers, look up players'), h('option', { value: 'admin' }, 'Admin: everything'));
  const btn = h('button', { class: 'btn primary', type: 'submit' }, 'Save');
  const load = async () => {
    try {
      const rows = await rpc('admin_list_staff');
      list.replaceChildren(table(['E-mail', 'Role', 'Since', ''], rows.map(r => [r.email, h('span', { class: 'badge ' + r.role }, r.role), fmtDate(r.created_at),
        r.email === session.email ? h('span', { class: 'muted' }, 'you') : h('button', { class: 'btn small danger', onclick: e => {
          if (!confirm('Remove staff access for ' + r.email + '?')) return;
          guarded(e.target, async () => { await rpc('admin_set_staff', { p_email: r.email, p_role: null }); toast('Access removed.'); load(); });
        } }, 'Remove')])));
    } catch (e) { list.replaceChildren(h('p', { class: 'error' }, e.message)); }
  };
  body.append(h('form', { class: 'card', onsubmit: e => {
    e.preventDefault();
    guarded(btn, async () => { await rpc('admin_set_staff', { p_email: email.value.trim(), p_role: role.value }); toast('Saved. They can sign in here with their account.'); email.value = ''; load(); });
  } }, h('h2', {}, 'Add or change staff'), h('p', { class: 'muted' }, 'The person must already have a Chompimon account (sign up in the game first).'),
    h('div', { class: 'row' }, field('E-mail', email), field('Role', role), btn)),
    h('div', { class: 'card' }, h('h2', {}, 'Current staff'), list));
  load();
}

// ---------- activity (admin) ----------
function auditDetail(r) {
  const d = r.details || {};
  switch (r.action) {
    case 'create_codes': return d.count + ' × ' + (d.product ? d.product + ' ' + (d.size || '') + ' oz · ' : '') + fmtNum(d.amount || 0) + ' coins, ' + d.valid_hours + 'h' + (d.note ? ' · ' + d.note : '');
    case 'adjust_balance': return (d.amount > 0 ? '+' : '') + fmtNum(d.amount) + ' coins · ' + d.note;
    case 'set_staff': return 'role: ' + (d.role || 'removed');
    case 'send_mail': case 'broadcast_mail': return '"' + d.title + '"' + (d.coins ? ' · ' + fmtNum(d.coins) + ' coins' : '') + (d.exp ? ' · ' + fmtNum(d.exp) + ' EXP' : '')
      + (d.simon ? ' · ' + (RARITY[d.rarity] || '') + ' ' + simonName(d.simon) : '') + (d.badges ? ' · ' + d.badges + ' ' + d.badge_kind + ' badges' : '') + (d.count > 1 ? ' · to ' + fmtNum(d.count) + ' players' : '');
    case 'rename_player': return (d.from || '(none)') + ' → ' + d.to + ' · ' + d.note;
    case 'heal_player': return d.simons + ' Simons';
    case 'save_event': return (d.new ? 'New: ' : 'Changed: ') + '"' + d.title + '" · ' + (EVENT_KINDS[d.kind] || d.kind) + ' · ' + shortDate(d.starts) + ' – ' + shortDate(d.ends);
    case 'end_event': return '"' + d.title + '"';
    case 'set_simon_level': return simonName(d.simon) + ' → LV ' + d.level + ' · ' + d.note;
    default: return Object.keys(d).length ? JSON.stringify(d) : '';
  }
}
function activityView(body) {
  const list = h('div', {}, loading());
  let rows = [];
  const kinds = [['all', 'All']];
  const draw = st => {
    const shown = rows.filter(r => (st.status === 'all' || r.action === st.status) && matches(st.q, r.actor_email, r.target_email, auditDetail(r)));
    list.replaceChildren(shown.length ? table(['When', 'Who', 'What', 'Player', 'Details'], shown.map(r =>
      [fmtDate(r.created_at), r.actor_email || '', ACTIONS[r.action] || r.action, r.target_email || '', auditDetail(r)])) : empty('Nothing matches.'));
  };
  const box = h('div');
  body.append(h('div', { class: 'card' }, cardHead('Activity log', csvButton('activity', ['When', 'Who', 'What', 'Player', 'Details'],
    () => rows.map(r => [r.created_at, r.actor_email || '', ACTIONS[r.action] || r.action, r.target_email || '', auditDetail(r)]))),
    h('p', { class: 'muted' }, 'Every staff action, newest first. This log cannot be edited.'), box, list));
  species().then(() => rpc('admin_audit_log', { p_limit: 1000 })).then(r => {
    rows = r;
    [...new Set(rows.map(x => x.action))].forEach(a => kinds.push([a, ACTIONS[a] || a]));
    const fb = filterBar(kinds, draw, 'Who, player or details');
    box.append(fb.el); draw(fb.state);
  }).catch(e => list.replaceChildren(h('p', { class: 'error' }, e.message)));
}

function table(head, rows) {
  return h('div', { class: 'table-wrap' }, h('table', {}, h('thead', {}, h('tr', {}, head.map(t => h('th', {}, t)))),
    h('tbody', {}, rows.map(r => h('tr', {}, r.map((c, i) => h('td', { 'data-label': head[i] || '' }, c)))))));
}

render();
</script>
</body>
